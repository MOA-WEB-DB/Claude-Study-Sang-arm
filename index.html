    <style>
        * {

            padding: 0;
            box-sizing: border-box;

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {

        }

            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));

            margin: 30px 0;
        }
        .menu-item {
            background: #f8f9fa;
            border: 2px solid #e9ecef;

            transition: all 0.3s ease;

        }
        .menu-item:hover {
            border-color: #667eea;
            background: #f0f4ff;

        .menu-item h3 {
            color: #667eea;
            margin-bottom: 8px;
        }
        .menu-item p {
            font-size: 0.9em;
            color: #666;
        }
        .files {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }
        .files h3 {
            color: #333;
            margin-bottom: 15px;
        }
        .file-link {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border-left: 3px solid #667eea;
            color: #667eea;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        .file-link:hover {
            background: #f0f4ff;
            padding-left: 20px;
        }
        .footer {
            color: #999;
            font-size: 0.9em;
            margin-top: 30px;
