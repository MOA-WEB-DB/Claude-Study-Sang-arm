<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="1100" height="340" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif">
  <defs>
    <!-- Gradients for each card -->
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa709a"/>
      <stop offset="100%" stop-color="#fee140"/>
    </linearGradient>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <!-- Drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="340" fill="url(#bg)" rx="20"/>

  <!-- Subtle dot grid pattern -->
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.06)"/>
  </pattern>
  <rect width="1100" height="340" fill="url(#dots)" rx="20"/>

  <!-- Title -->
  <text x="550" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="white" letter-spacing="2" opacity="0.95">마케팅 업무 흐름</text>
  <line x1="430" y1="52" x2="670" y2="52" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- ── STEP 1: 기획 ── -->
  <g filter="url(#shadow)">
    <rect x="40" y="80" width="160" height="190" rx="18" fill="url(#g1)" opacity="0.95"/>
  </g>
  <!-- Icon circle -->
  <circle cx="120" cy="140" r="32" fill="rgba(255,255,255,0.2)"/>
  <!-- Lightbulb icon -->
  <g transform="translate(120,140)" fill="white">
    <ellipse cx="0" cy="-6" rx="12" ry="14" opacity="0.95"/>
    <rect x="-7" y="8" width="14" height="4" rx="2"/>
    <rect x="-5" y="13" width="10" height="4" rx="2"/>
    <rect x="-3" y="18" width="6" height="3" rx="1.5"/>
    <!-- shine lines -->
    <line x1="15" y1="-10" x2="20" y2="-14" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="-4" x2="22" y2="-4" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="-15" y1="-10" x2="-20" y2="-14" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="-16" y1="-4" x2="-22" y2="-4" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-24" x2="0" y2="-30" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="120" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="white">기획</text>
  <text x="120" y="216" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">전략 수립</text>
  <text x="120" y="232" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">타겟 분석</text>
  <text x="120" y="248" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">캠페인 설계</text>
  <!-- Step badge -->
  <circle cx="60" cy="98" r="14" fill="rgba(255,255,255,0.25)"/>
  <text x="60" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="white">1</text>

  <!-- Arrow 1→2 -->
  <g filter="url(#glow)">
    <line x1="205" y1="175" x2="248" y2="175" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" stroke-dasharray="5,3"/>
    <polygon points="248,169 260,175 248,181" fill="rgba(255,255,255,0.7)"/>
  </g>

  <!-- ── STEP 2: 콘텐츠 제작 ── -->
  <g filter="url(#shadow)">
    <rect x="265" y="80" width="160" height="190" rx="18" fill="url(#g2)" opacity="0.95"/>
  </g>
  <circle cx="345" cy="140" r="32" fill="rgba(255,255,255,0.2)"/>
  <!-- Pencil / content icon -->
  <g transform="translate(345,140)" fill="white">
    <rect x="-4" y="-18" width="10" height="28" rx="2" transform="rotate(-30)" opacity="0.95"/>
    <polygon points="-10,16 -4,10 2,16" transform="rotate(-30)"/>
    <rect x="-4" y="-22" width="10" height="6" rx="2" fill="rgba(255,200,100,0.9)" transform="rotate(-30)"/>
    <!-- lines representing text -->
    <line x1="5" y1="2" x2="16" y2="2" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="5" y1="8" x2="16" y2="8" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="5" y1="14" x2="12" y2="14" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>
  <text x="345" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="white">콘텐츠 제작</text>
  <text x="345" y="216" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">카피라이팅</text>
  <text x="345" y="232" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">디자인 작업</text>
  <text x="345" y="248" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">영상 제작</text>
  <circle cx="285" cy="98" r="14" fill="rgba(255,255,255,0.25)"/>
  <text x="285" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="white">2</text>

  <!-- Arrow 2→3 -->
  <g filter="url(#glow)">
    <line x1="430" y1="175" x2="473" y2="175" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" stroke-dasharray="5,3"/>
    <polygon points="473,169 485,175 473,181" fill="rgba(255,255,255,0.7)"/>
  </g>

  <!-- ── STEP 3: 검토 ── -->
  <g filter="url(#shadow)">
    <rect x="490" y="80" width="160" height="190" rx="18" fill="url(#g3)" opacity="0.95"/>
  </g>
  <circle cx="570" cy="140" r="32" fill="rgba(255,255,255,0.2)"/>
  <!-- Checkmark / review icon -->
  <g transform="translate(570,140)" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-16" y="-18" width="32" height="28" rx="4" stroke-width="2.5" fill="rgba(255,255,255,0.15)"/>
    <polyline points="-8,0 -2,8 10,-8" stroke-width="3"/>
    <line x1="-10" y1="-8" x2="4" y2="-8" stroke-width="2" opacity="0.6"/>
    <line x1="-10" y1="-3" x2="-4" y2="-3" stroke-width="2" opacity="0.6"/>
  </g>
  <text x="570" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="white">검토</text>
  <text x="570" y="216" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">내부 피드백</text>
  <text x="570" y="232" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">수정 및 보완</text>
  <text x="570" y="248" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">최종 승인</text>
  <circle cx="510" cy="98" r="14" fill="rgba(255,255,255,0.25)"/>
  <text x="510" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="white">3</text>

  <!-- Arrow 3→4 -->
  <g filter="url(#glow)">
    <line x1="655" y1="175" x2="698" y2="175" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" stroke-dasharray="5,3"/>
    <polygon points="698,169 710,175 698,181" fill="rgba(255,255,255,0.7)"/>
  </g>

  <!-- ── STEP 4: 배포 ── -->
  <g filter="url(#shadow)">
    <rect x="715" y="80" width="160" height="190" rx="18" fill="url(#g4)" opacity="0.95"/>
  </g>
  <circle cx="795" cy="140" r="32" fill="rgba(255,255,255,0.2)"/>
  <!-- Rocket / deploy icon -->
  <g transform="translate(795,140)" fill="white">
    <ellipse cx="0" cy="-6" rx="9" ry="16" opacity="0.95"/>
    <polygon points="-9,6 -16,18 0,12 16,18 9,6" opacity="0.8"/>
    <circle cx="0" cy="-4" r="5" fill="rgba(100,220,255,0.8)"/>
    <!-- flames -->
    <ellipse cx="-4" cy="16" rx="3" ry="5" fill="rgba(255,200,50,0.9)" transform="rotate(-10)"/>
    <ellipse cx="4" cy="16" rx="3" ry="5" fill="rgba(255,150,50,0.9)" transform="rotate(10)"/>
  </g>
  <text x="795" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="white">배포</text>
  <text x="795" y="216" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">채널 선택</text>
  <text x="795" y="232" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">스케줄 발행</text>
  <text x="795" y="248" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">광고 집행</text>
  <circle cx="735" cy="98" r="14" fill="rgba(255,255,255,0.25)"/>
  <text x="735" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="white">4</text>

  <!-- Arrow 4→5 -->
  <g filter="url(#glow)">
    <line x1="880" y1="175" x2="923" y2="175" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" stroke-dasharray="5,3"/>
    <polygon points="923,169 935,175 923,181" fill="rgba(255,255,255,0.7)"/>
  </g>

  <!-- ── STEP 5: 성과 분석 ── -->
  <g filter="url(#shadow)">
    <rect x="940" y="80" width="120" height="190" rx="18" fill="url(#g5)" opacity="0.95"/>
  </g>
  <circle cx="1000" cy="140" r="32" fill="rgba(255,255,255,0.2)"/>
  <!-- Bar chart / analytics icon -->
  <g transform="translate(1000,140)" fill="white">
    <rect x="-16" y="10" width="8" height="8" rx="1" opacity="0.9"/>
    <rect x="-5" y="0" width="8" height="18" rx="1" opacity="0.9"/>
    <rect x="6" y="-10" width="8" height="28" rx="1" opacity="0.9"/>
    <!-- trend line -->
    <polyline points="-12,-12 -1,-8 10,-16" fill="none" stroke="rgba(255,255,100,0.9)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="10" cy="-16" r="3" fill="rgba(255,255,100,0.9)"/>
  </g>
  <text x="1000" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="white">성과 분석</text>
  <text x="1000" y="216" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">KPI 측정</text>
  <text x="1000" y="232" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">리포트 작성</text>
  <text x="1000" y="248" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">인사이트 도출</text>
  <circle cx="960" cy="98" r="14" fill="rgba(255,255,255,0.25)"/>
  <text x="960" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="white">5</text>

  <!-- Feedback loop arrow (bottom) -->
  <path d="M 1000 278 Q 550 320 120 278" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="120,272 108,278 120,284" fill="rgba(255,255,255,0.35)"/>
  <text x="550" y="315" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.4)" letter-spacing="1">피드백 루프 (지속적 개선)</text>
</svg>
